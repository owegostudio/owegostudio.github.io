<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subscription Cost Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: #f8fafc;
    }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-2xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        Subscription Cost Calculator
    </h1>

    <!-- Form -->
    <div class="space-y-4">
        <div>
            <label class="block text-gray-700 font-medium">Subscription Name</label>
            <input id="name" type="text" class="w-full mt-1 p-3 border rounded-lg" placeholder="Netflix, Spotify, etc">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Cost</label>
            <input id="cost" type="number" class="w-full mt-1 p-3 border rounded-lg" placeholder="9.99">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Billing Cycle</label>
            <select id="cycle" class="w-full mt-1 p-3 border rounded-lg">
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
        </div>

        <button onclick="addSubscription()" 
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
            Add Subscription
        </button>
    </div>

    <!-- Results -->
    <div class="mt-10">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Your Subscriptions</h2>
        <div id="list" class="space-y-3"></div>
    </div>

    <!-- Totals -->
    <div class="mt-10 p-6 bg-gray-100 rounded-lg">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Totals</h2>

        <p class="text-gray-700 text-lg">
            Monthly Total: <span id="monthlyTotal" class="font-bold">£0.00</span>
        </p>
        <p class="text-gray-700 text-lg">
            Yearly Total: <span id="yearlyTotal" class="font-bold">£0.00</span>
        </p>
    </div>
</div>

<script>
let subscriptions = [];

function addSubscription() {
    const name = document.getElementById("name").value.trim();
    const cost = parseFloat(document.getElementById("cost").value);
    const cycle = document.getElementById("cycle").value;

    if (!name || !cost) {
        alert("Please enter a valid name and cost");
        return;
    }

    subscriptions.push({ name, cost, cycle });
    renderList();
    calculateTotals();

    document.getElementById("name").value = "";
    document.getElementById("cost").value = "";
}

function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    subscriptions.forEach((sub, index) => {
        const div = document.createElement("div");
        div.className = "p-4 bg-white border rounded-lg flex justify-between items-center";

        div.innerHTML = `
            <div>
                <p class="font-semibold text-gray-800">${sub.name}</p>
                <p class="text-gray-600 text-sm">£${sub.cost.toFixed(2)} / ${sub.cycle}</p>
            </div>
            <button onclick="removeSubscription(${index})"
                class="text-red-600 font-semibold hover:underline">
                Remove
            </button>
        `;

        list.appendChild(div);
    });
}

function removeSubscription(index) {
    subscriptions.splice(index, 1);
    renderList();
    calculateTotals();
}

function calculateTotals() {
    let monthly = 0;
    let yearly = 0;

    subscriptions.forEach(sub => {
        if (sub.cycle === "monthly") {
            monthly += sub.cost;
            yearly += sub.cost * 12;
        } else {
            yearly += sub.cost;
            monthly += sub.cost / 12;
        }
    });

    document.getElementById("monthlyTotal").textContent = "£" + monthly.toFixed(2);
    document.getElementById("yearlyTotal").textContent = "£" + yearly.toFixed(2);
}
</script>

</body>
</html>
